spring.application.name=motorcycles-api

spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/motorcycles_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD}

app.admin.username=${ADMIN_USERNAME}
app.admin.password=${ADMIN_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false

springdoc.swagger-ui.csrf.enabled=true

server.port=${PORT:8080}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}